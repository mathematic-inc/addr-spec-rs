name: Restrict pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  close-external-pull-request:
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh pr close "$PR_NUMBER"
          --comment "Thanks for the proposal. We do not accept pull requests
          from external contributors. Please start a Discussion at
          https://github.com/$GH_REPO/discussions/new. If we approve it, a
          Mathematic maintainer or agent will implement it and open the pull
          request."
