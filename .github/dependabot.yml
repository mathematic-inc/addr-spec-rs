version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
