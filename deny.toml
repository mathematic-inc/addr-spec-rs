[licenses]
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-4-Clause",
  "CC0-1.0",
  "ISC",
  "MIT-0",
  "MIT",
  "MS-PL",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[[licenses.clarify]]
name = "databake-derive"
expression = "Unicode-DFS-2016"
license-files = [{ path = "LICENSE", hash = 0xbbcfaf3d }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
