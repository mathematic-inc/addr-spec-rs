[package]
name = "addr-spec"
version = "0.10.3"
edition = "2021"
rust-version = "1.81"
description = "A wicked fast UTF-8 email address parser and serializer."
license = "Apache-2.0"
authors = ["Mathematic Inc"]
documentation = "https://mathematic-inc.github.io/addr-spec-rs"
repository = "https://github.com/mathematic-inc/addr-spec-rs"
categories = ["parsing", "text-processing"]
keywords = ["address", "email", "parser", "rfc2822", "rfc5322"]

[dependencies]
unicode-normalization = { version = "0.1.25", default-features = false, optional = true }

email_address = { version = "0.2.9", default-features = false, optional = true }

[dependencies.serde]
version = "1.0.229"
default-features = false
features = ["alloc", "derive"]
optional = true

[dev-dependencies]
regex = "1.13.1"

[build-dependencies]
rustc_version = "0.4"

[features]
default = ["normalization"]
comments = ["white-spaces"]
literals = []
nightly = []
normalization = ["dep:unicode-normalization"]
white-spaces = []

[profile.release]
lto = true
